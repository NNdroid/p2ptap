name: Fix TAP Writer Import

on:
  push:
    branches:
      - perf/dedicated-tap-writer

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[tap-import-fix-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale import and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pkg/node/boot_relay.go')
          s = p.read_text()
          old = '\t"encoding/binary"\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale encoding/binary import, got {s.count(old)}')
          p.write_text(s.replace(old, '', 1))
          PY
          gofmt -w pkg/node/boot_relay.go
          rm .github/workflows/fix-tap-writer-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/node/boot_relay.go .github/workflows/fix-tap-writer-import.yml
          git commit -m "fix(tap): drop stale boot relay import [tap-import-fix-done]"
          git push origin HEAD:perf/dedicated-tap-writer
