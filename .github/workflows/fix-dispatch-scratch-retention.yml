name: Fix Dispatch Scratch Retention

on:
  push:
    branches: [perf/dispatch-scratch]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[scratch-retention-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch unicast scratch cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('pkg/node/node_dispatch.go')
          s = p.read_text()
          start = s.index('case 0: // unicast')
          end = s.index('case 1: // broadcast', start)
          u = s[start:end]

          old = '''if n.peerStalled(target) {
          						for i, t := range tasks {
          							if t.owned {
          								releaseFrameBuf(batch[i])
          							}
          						}
          						continue
          					}'''
          new = '''if n.peerStalled(target) {
          						for i, t := range tasks {
          							if t.owned {
          								releaseFrameBuf(batch[i])
          							}
          							batch[i] = nil
          						}
          						continue
          					}'''
          if u.count(old) != 1:
              raise SystemExit(f'stalled unicast match={u.count(old)}')
          u = u.replace(old, new, 1)

          old = '''if owned {
          							releaseFrameBuf(data)
          						}
          					} else {'''
          new = '''if owned {
          							releaseFrameBuf(data)
          						}
          						batch[0] = nil
          					} else {'''
          if u.count(old) != 1:
              raise SystemExit(f'single-frame unicast match={u.count(old)}')
          u = u.replace(old, new, 1)

          p.write_text(s[:start] + u + s[end:])
      - name: Commit and self-delete
        run: |
          gofmt -w pkg/node/node_dispatch.go
          rm .github/workflows/fix-dispatch-scratch-retention.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/node/node_dispatch.go .github/workflows/fix-dispatch-scratch-retention.yml
          git commit -m "perf(dispatch): clear worker scratch references [scratch-retention-done]"
          git push origin HEAD:perf/dispatch-scratch
