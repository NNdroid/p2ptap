name: Apply Linux TAP batch 128

on:
  push:
    branches:
      - perf/linux-tap-batch-128

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply measured batch limit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pkg/node/node_tap.go')
          s = p.read_text()
          old = '''// drainTapBatch reads up to 32 frames from TAP in a tight loop, calling
          // processTapFrame for each.  It expects the fd to be readable (non-blocking
          // reads succeed) and stops on the first EAGAIN / timeout.
          func (n *Node) drainTapBatch(buf []byte) {
          \treadErrors := 0
          \ttotalRead := 0
          \tfor batchIdx := 0; batchIdx < 32; batchIdx++ {
          '''
          new = '''// linuxTAPDrainBatchSize is benchmark-selected for the epoll path. A 256-frame
          // burst needs two epoll wake/drain cycles at 128 versus eight at 32; the
          // stage2 benchmark showed ~1.7% lower median drain time while avoiding the
          // higher variance observed at 256. Non-epoll fallback polling stays at 32.
          const linuxTAPDrainBatchSize = 128

          // drainTapBatch reads up to linuxTAPDrainBatchSize frames from TAP in a tight
          // loop, calling processTapFrame for each. It expects the fd to be readable
          // (non-blocking reads succeed) and stops on the first EAGAIN / timeout.
          func (n *Node) drainTapBatch(buf []byte) {
          \treadErrors := 0
          \ttotalRead := 0
          \tfor batchIdx := 0; batchIdx < linuxTAPDrainBatchSize; batchIdx++ {
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one drainTapBatch block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w pkg/node/node_tap.go

      - name: Commit production change and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-linux-tap-batch-128.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/node/node_tap.go .github/workflows/apply-linux-tap-batch-128.yml
          git commit -m "perf(tap): raise Linux epoll drain batch to 128"
          git push
