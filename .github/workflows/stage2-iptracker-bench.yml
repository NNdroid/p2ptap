name: Stage2 IP Tracker Benchmark

on:
  workflow_dispatch:

concurrency:
  group: stage2-iptracker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iptracker-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Benchmark IP tracker hot path
        shell: bash
        run: |
          set -o pipefail
          mkdir -p perf-results
          go test ./pkg/node \
            -run '^$' \
            -bench '^BenchmarkIPTrackerExtractAndRecordIPv4$' \
            -benchmem \
            -benchtime=2s \
            -count=5 \
            | tee perf-results/iptracker.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-iptracker-results
          path: perf-results/iptracker.txt
