name: Apply IPTracker Performance Patch

on:
  push:
    branches: [perf/iptracker-hotpath]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[iptracker-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/apply_iptracker_patch.py
      - name: Format and commit
        run: |
          gofmt -w pkg/node/ip_tracker.go
          rm .github/apply_iptracker_patch.py .github/workflows/apply-iptracker-perf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/node/ip_tracker.go .github/apply_iptracker_patch.py .github/workflows/apply-iptracker-perf.yml
          git commit -m "perf(stats): reduce per-packet IP tracker synchronization [iptracker-patch-done]"
          git push origin HEAD:perf/iptracker-hotpath
