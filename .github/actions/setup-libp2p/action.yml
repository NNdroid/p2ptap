name: Setup patched go-libp2p
description: |
  Materialise pkg/go-libp2p from the pinned upstream release plus the local
  patch (see patches/go-libp2p/README.md). The tree is intentionally NOT
  versioned, so every job that compiles or tests this module must run this
  step first; without it `go build` fails on the missing `replace` target.

runs:
  using: composite
  steps:
    - name: Fetch upstream go-libp2p and apply the local patch
      shell: bash
      # Invoke through bash explicitly: a Windows checkout of this repo has
      # core.filemode=false, so the executable bit does not survive a re-add of
      # the script and `./scripts/...` would die with exit 126 on Linux runners.
      run: bash ./scripts/fetch-libp2p.sh
